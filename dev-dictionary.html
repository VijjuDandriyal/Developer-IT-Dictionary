<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevLex — Developer IT Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #09090b;
  --surface: #111115;
  --surface2: #18181d;
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14);
  --text: #f0ede8;
  --muted: #7a7880;
  --subtle: #3a3840;
  --accent: #a8ff3e;
  --accent-dim: rgba(168,255,62,0.12);
  --accent-border: rgba(168,255,62,0.35);
  --radius: 12px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── NOISE OVERLAY ─── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 256px;
  pointer-events: none;
  opacity: 0.5;
}

/* ─── GRID BG ─── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* ─── GLOW ─── */
.glow {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(168,255,62,0.06) 0%, transparent 70%);
  top: -200px; right: -100px;
  pointer-events: none; z-index: 0;
}

/* ─── LAYOUT ─── */
.shell {
  position: relative; z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

/* ─── HEADER ─── */
header {
  margin-bottom: 48px;
  animation: fadeUp 0.6s ease both;
}

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 12px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 12px;
}

h1 span {
  color: var(--accent);
}

.tagline {
  font-size: 15px;
  color: var(--muted);
  font-weight: 300;
  max-width: 480px;
}

/* ─── STAT PILLS ─── */
.stats-row {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.stat-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 5px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}

.stat-pill strong {
  color: var(--text);
  font-weight: 600;
}

/* ─── SEARCH BAR ─── */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
  animation: fadeUp 0.6s 0.1s ease both;
}

.search-icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

#search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px 14px 46px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

#search::placeholder { color: var(--muted); }

#search:focus {
  border-color: var(--accent-border);
  box-shadow: 0 0 0 3px rgba(168,255,62,0.08);
}

kbd {
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

/* ─── CONTROLS ROW ─── */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  animation: fadeUp 0.6s 0.15s ease both;
}

.cat-btn {
  padding: 7px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}

.cat-btn:hover { border-color: var(--border-hover); color: var(--text); }

.cat-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--accent);
}

/* ─── ALPHA BAR ─── */
.alpha-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 28px;
  animation: fadeUp 0.6s 0.2s ease both;
}

.a-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--subtle);
  cursor: pointer;
  transition: all 0.15s;
}

.a-btn:hover { background: var(--surface2); color: var(--text); }

.a-btn.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.a-btn.has-terms { color: var(--muted); }

/* ─── RESULTS HEADER ─── */
.results-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}

#result-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}

.sort-select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  outline: none;
}

/* ─── GRID ─── */
#dict {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ─── CARD ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: default;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.35s ease both;
}

.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
  background: var(--cat-color, var(--subtle));
  opacity: 0;
  transition: opacity 0.2s;
}

.card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}

.card:hover::before { opacity: 1; }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}

.term {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

.badge {
  font-size: 10px;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.06em;
  padding: 3px 9px;
  border-radius: 100px;
  white-space: nowrap;
  flex-shrink: 0;
  border: 1px solid transparent;
}

.def {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.65;
  font-weight: 300;
}

.also {
  margin-top: 10px;
  display: flex; align-items: center; gap: 6px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--subtle);
}

.also::before {
  content: '→';
  color: var(--accent);
  font-size: 11px;
}

/* ─── EMPTY ─── */
#empty {
  display: none;
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}

#empty svg { margin-bottom: 16px; opacity: 0.3; }
#empty p { font-size: 14px; }
#empty small {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--subtle);
  margin-top: 6px;
  display: block;
}

/* ─── ANIMATIONS ─── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--subtle); border-radius: 3px; }

/* ─── HIGHLIGHT ─── */
mark {
  background: rgba(168,255,62,0.25);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 1px;
}

/* ─── DIVIDER ─── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 28px 0;
}

/* ─── FOOTER ─── */
footer {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

footer p {
  font-size: 12px;
  color: var(--subtle);
  font-family: 'JetBrains Mono', monospace;
}

footer span { color: var(--accent); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="shell">

  <!-- HEADER -->
  <header>
    <p class="eyebrow">// ready reference · v2.0</p>
    <h1>Dev<span>Lex</span></h1>
    <p class="tagline">A worldwide developer dictionary for information technology — 200+ terms, every domain.</p>
    <div class="stats-row">
      <div class="stat-pill"><strong id="total-count">200</strong> terms</div>
      <div class="stat-pill"><strong>15</strong> categories</div>
      <div class="stat-pill"><strong>∞</strong> caffeine required</div>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">
    <svg class="search-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="text" placeholder="Search any term, acronym, or concept…" autocomplete="off" spellcheck="false" />
    <kbd>/</kbd>
  </div>

  <!-- CATEGORY FILTERS -->
  <div class="controls" id="catControls">
    <button class="cat-btn active" data-cat="">All</button>
  </div>

  <!-- ALPHA BAR -->
  <div class="alpha-bar" id="alphaBar"></div>

  <!-- RESULTS META -->
  <div class="results-header">
    <span id="result-count"></span>
    <select class="sort-select" id="sortSel">
      <option value="alpha">A → Z</option>
      <option value="cat">By category</option>
    </select>
  </div>

  <!-- DICTIONARY GRID -->
  <div id="dict">
    <div id="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No terms found</p>
      <small id="empty-hint"></small>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>// DevLex &mdash; built for <span>developers</span></p>
    <p>last updated · <span>2025</span></p>
  </footer>

</div>

<script>
const CAT_COLORS = {

const TERMS = [
  {t:"API",c:"Web Dev",d:"Application Programming Interface — a contract that lets two software systems communicate via defined endpoints, request methods, and data formats.",also:"REST API, GraphQL, gRPC"},
  {t:"REST",c:"Web Dev",d:"Representational State Transfer — an architectural style for web APIs using stateless HTTP methods (GET, POST, PUT, DELETE) to manipulate resources."},
  {t:"GraphQL",c:"Web Dev",d:"A query language for APIs where clients specify exactly what data they need, reducing over-fetching and under-fetching compared to REST."},
  {t:"WebSocket",c:"Networking",d:"A protocol providing full-duplex communication channels over a single TCP connection, enabling real-time data push from server to client."},
  {t:"HTTP/3",c:"Networking",d:"The third major version of HTTP, built on QUIC instead of TCP, offering lower latency and improved performance on lossy networks."},
  {t:"CDN",c:"Networking",d:"Content Delivery Network — a geographically distributed server network that delivers static assets to users from the nearest edge node."},

  {t:"HTTPS",c:"Security",d:"HTTP Secure — HTTP with TLS encryption, ensuring confidentiality, integrity, and server authentication between browser and server."},
  {t:"Firewall",c:"Security",d:"A network security system monitoring and controlling incoming/outgoing traffic based on predefined security rules."},

  {t:"Sharding",c:"Databases",d:"Horizontal partitioning — splitting large datasets across multiple machines to improve performance and scalability."},

];

document.getElementById("total-count").textContent = TERMS.length;

// Build category buttons
const cats = [...new Set(TERMS.map(x => x.c))].sort();
const catControls = document.getElementById("catControls");
cats.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.dataset.cat = c;
  btn.textContent = c;
  const col = CAT_COLORS[c];
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeCat = c;
    render();
  });
  catControls.appendChild(btn);
});

// All button
document.querySelector("[data-cat='']").onclick = () => {
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  document.querySelector("[data-cat='']").classList.add("active");
  activeCat = "";
  render();
};

// Alpha bar
const letters = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
const alphaBar = document.getElementById("alphaBar");
const termFirstLetters = new Set(TERMS.map(t => t.t[0].toUpperCase()));
let activeLetter = "";

letters.forEach(l => {
  const btn = document.createElement("button");
  btn.className = "a-btn" + (termFirstLetters.has(l) ? " has-terms" : "");
  btn.textContent = l;
  btn.dataset.l = l;
  btn.onclick = () => {
    if (activeLetter === l) {
      activeLetter = "";
      btn.classList.remove("active");
    } else {
      document.querySelectorAll(".a-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeLetter = l;
    }
    render();
  };
  alphaBar.appendChild(btn);
});

// State
let searchVal = "";
let activeCat = "";

const searchEl = document.getElementById("search");
searchEl.addEventListener("input", e => {
  searchVal = e.target.value.toLowerCase();
  activeLetter = "";
  document.querySelectorAll(".a-btn").forEach(b => b.classList.remove("active"));
  render();
});

document.getElementById("sortSel").addEventListener("change", render);

// Keyboard shortcut
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === "Escape") {
    searchEl.value = "";
    searchVal = "";
    render();
  }
});

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) + "<mark>" + text.slice(idx, idx + q.length) + "</mark>" + highlight(text.slice(idx + q.length), q);
}

function render() {
  const q = searchVal;
  const cat = activeCat;
  const sort = document.getElementById("sortSel").value;
  const grid = document.getElementById("dict");
  const empty = document.getElementById("empty");

  let filtered = TERMS.filter(term => {
    if (cat && term.c !== cat) return false;
    if (activeLetter && !term.t.toUpperCase().startsWith(activeLetter)) return false;
    if (q) {
      const haystack = (term.t + " " + term.d + " " + (term.also || "")).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  if (sort === "cat") {
    filtered.sort((a, b) => a.c.localeCompare(b.c) || a.t.localeCompare(b.t));
  } else {
    filtered.sort((a, b) => a.t.localeCompare(b.t));
  }

  document.getElementById("result-count").textContent =
    filtered.length === TERMS.length
      ? `${TERMS.length} terms`
      : `${filtered.length} of ${TERMS.length} terms`;

  // Remove all cards
  Array.from(grid.querySelectorAll(".card")).forEach(c => c.remove());

  if (!filtered.length) {
    empty.style.display = "block";
    document.getElementById("empty-hint").textContent = q ? `Try a different keyword — searched "${q}"` : "Try clearing filters";
    return;
  }
  empty.style.display = "none";

  filtered.forEach((term, i) => {
    const col = CAT_COLORS[term.c] || { bg:"rgba(100,100,100,0.1)", border:"rgba(100,100,100,0.3)", text:"#aaa", bar:"#666" };
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--cat-color", col.bar);
    card.style.animationDelay = Math.min(i * 18, 280) + "ms";

    const termHL = highlight(term.t, q);
    const defHL = highlight(term.d, q);
    const alsoHL = term.also ? highlight(term.also, q) : "";

    card.innerHTML = `
      <div class="card-top">
        <span class="term">${termHL}</span>
        <span class="badge" style="background:${col.bg};border-color:${col.border};color:${col.text}">${term.c}</span>
      </div>
      <p class="def">${defHL}</p>
      ${term.also ? `<p class="also">${alsoHL}</p>` : ""}
    `;
    grid.appendChild(card);
  });
}

render();
</script>
</body>
